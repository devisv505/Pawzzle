<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Resolve every path from the game root, so piece.js finds its sprites. -->
  <base href="../../">
  <title>Pawzzle cover</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* A still picture: every element shows its finished state. */
    *,
    *::before,
    *::after {
      animation: none !important;
      transition: none !important;
    }

    body {
      position: relative;
      background-size: 560px;
    }

    .glow,
    .logo-text,
    .cats-row,
    .stage,
    .decor {
      position: absolute;
      transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    }

    .glow {
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 240, 210, 0.95), rgba(255, 226, 180, 0.55) 55%, rgba(255, 220, 170, 0));
    }

    .logo-text {
      white-space: nowrap;
    }

    .cats-row img {
      flex: 1;
      min-width: 0;
      width: auto;
    }

    .cats-row[hidden] {
      display: none;
    }

    .board {
      --pad: calc(var(--cell) * 0.17);
      border-radius: calc(var(--cell) * 0.36);
      box-shadow: 0 0 0 6px #ffdcab, 0 0 46px 12px rgba(255, 196, 110, 0.6), inset 0 -8px 0 #d18545, inset 0 4px 0 rgba(255, 255, 255, 0.45),
        0 22px 36px rgba(115, 49, 19, 0.3);
    }

    .tile {
      margin: calc(var(--cell) * 0.035);
    }

    .piece.floating {
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="stage">
    <div class="board">
      <div class="grid" id="grid">
        <div class="tiles" id="tiles"></div>
        <div class="pieces" id="pieces"></div>
      </div>
    </div>
  </div>
  <h1 class="logo-text">Pawzzle</h1>
  <div class="cats-row">
    <img src="assets/img/faces/happy-pink.webp" alt="">
    <img src="assets/img/faces/happy-orange.webp" alt="">
    <img src="assets/img/faces/happy-blue.webp" alt="">
  </div>
  <script type="module" src="tools/marketing/cover.js"></script>
</body>
</html>
